<title>Amr Elaouby — Full CV</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090d;--surface:#10121a;--border:#1c2030;
  --text:#e0e3ed;--muted:#6b7591;--accent:#7c5cfc;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
header{
  height:56px;display:flex;align-items:center;gap:12px;
  padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);
  position:relative;z-index:10;
}
.name{font-weight:700;font-size:1rem;white-space:nowrap}
.badge{
  font-size:.7rem;padding:2px 8px;border-radius:20px;
  background:rgba(124,92,252,.15);color:var(--accent);border:1px solid rgba(124,92,252,.35);
  white-space:nowrap;
}
.spacer{flex:1}
nav{display:flex;gap:6px;align-items:center}
.btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 12px;border:1px solid var(--border);border-radius:10px;
  background:rgba(255,255,255,.03);color:var(--text);text-decoration:none;
  font-size:.78rem;font-weight:500;white-space:nowrap;
  transition:background .12s,border-color .12s;line-height:1;
}
.btn:hover{background:rgba(255,255,255,.07);border-color:#2a3450}
.btn.primary{background:linear-gradient(160deg,#7c5cfc,#7c5cfccc);border-color:transparent;color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.1);border-color:transparent}
.btn svg{width:13px;height:13px;flex-shrink:0;fill:currentColor}
#stage{position:fixed;inset:56px 0 0 0}
#viewer{display:block;width:100%;height:100%;border:0}
@media(max-width:600px){
  .badge{display:none}
  nav .btn span{display:none}
  nav .btn{padding:7px}
  nav .btn svg{width:15px;height:15px}
}
</style>
</head>
